<div class="carousel-outer">
  <div class="carousel-wrapper">
    <div class="carousel-container">
      <img class="carousel-image" src="IMAGE_URL" alt="Slide 1">
      <img class="carousel-image" src="IMAGE_URL" alt="Slide 2">
      <img class="carousel-image" src="IMAGE_URL" alt="Slide 3">
      <img class="carousel-image" src="IMAGE_URL" alt="Slide 4">
      <img class="carousel-image" src="IMAGE_URL" alt="Slide 5">
    </div>

    <!-- Navigation Buttons -->
    <button class="carousel-btn prev">◀</button>
    <button class="carousel-btn next">▶</button>
  </div>

  <!-- Popup Animal -->
  <img class="popup-animal" src="https://i.imgur.com/8bud9ho.png" alt="Cute Animal">
</div>

<style>
/* Outer */
.carousel-outer {
  position: relative;
  width: 100%;
  max-width: 900px;
  margin: 20px auto;
  overflow: visible;
}

/* Inner */
.carousel-wrapper {
  position: relative;
  width: 100%;
  overflow: hidden;
  border-radius: 15px;
  box-shadow: 0 8px 15px rgba(0,0,0,0.2);
}

/* Image container */
.carousel-container {
  display: flex;
  transition: transform 0.5s ease;
}

/* Each image */
.carousel-image {
  flex: 0 0 100%;
  width: 100%;
  object-fit: cover;
}

/* Buttons */
.carousel-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.5);
  color: white;
  border: none;
  padding: 12px 16px;
  cursor: pointer;
  border-radius: 50%;
  z-index: 10;
  transition: background 0.3s ease;
}

.carousel-btn:hover {
  background: rgba(0,0,0,0.8);
}

.carousel-btn.prev { left: 10px; }
.carousel-btn.next { right: 10px; }

/* Popup Animal */
.popup-animal {
  position: absolute;
  bottom: -20px;
  left: 0;
  width: 100px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.35s ease, transform 0.35s ease;
  pointer-events: none;
  z-index: 9999;
}

/* Hover over the whole outer area to show animal */
.carousel-outer:hover .popup-animal {
  opacity: 1;
  transform: translateY(0);
}

/* Responsive */
@media (max-width: 900px) and (min-width: 601px) {

  .carousel-outer {
    max-width: 96%;
    margin: 16px auto;
  }

  .carousel-wrapper {
    border-radius: 14px;
  }

  .carousel-container {
    align-items: center;
  }

  .carousel-image {
    width: 100%;
    height: auto;              
    max-height: 420px;         
    object-fit: contain;       
    background-color: #000;
  }

  .carousel-btn {
    padding: 10px 14px;
    font-size: 16px;
  }

  .carousel-btn.prev { left: 8px; }
  .carousel-btn.next { right: 8px; }

  .popup-animal {
    width: 85px;
    bottom: -16px;
  }
}

@media (max-width: 600px) {

  .carousel-outer {
    max-width: 92%;
    margin: 12px auto;
  }

  .carousel-wrapper {
    border-radius: 12px;
  }

  .carousel-image {
    max-height: 350px;
    object-fit: cover;
  }

  .carousel-btn {
    padding: 8px 10px;
    font-size: 14px;
  }

  .carousel-btn.prev { left: 6px; }
  .carousel-btn.next { right: 6px; }

  .popup-animal {
    width: 70px;
  }
}

@media (max-width: 400px) {

  .carousel-image {
    max-height: 180px;
  }

  .carousel-btn {
    padding: 6px 8px;
    font-size: 12px;
  }

  .popup-animal {
    width: 60px;
  }
}
</style>

<script>
const carouselOuter = document.querySelector('.carousel-outer');
const carouselWrapper = carouselOuter.querySelector('.carousel-wrapper');
const carouselContainer = carouselWrapper.querySelector('.carousel-container');
const images = carouselWrapper.querySelectorAll('.carousel-image');
const prevBtn = carouselWrapper.querySelector('.prev');
const nextBtn = carouselWrapper.querySelector('.next');
const popupAnimal = carouselOuter.querySelector('.popup-animal');

let index = 0;
const total = images.length;

/* Update slide position */
function updateCarousel() {
  carouselContainer.style.transform = `translateX(-${index * 100}%)`;
}

/* Buttons */
prevBtn.addEventListener('click', () => {
  index = (index - 1 + total) % total;
  updateCarousel();
});

nextBtn.addEventListener('click', () => {
  index = (index + 1) % total;
  updateCarousel();
});

let popupTimeout = null;

carouselOuter.addEventListener('mouseenter', () => {
  popupAnimal.style.opacity = '1';
  popupAnimal.style.transform = 'translateY(0)';

  if (popupTimeout) clearTimeout(popupTimeout);

  popupTimeout = setTimeout(() => {
    popupAnimal.style.opacity = '0';
    popupAnimal.style.transform = 'translateY(20px)';
  }, 10000);
});

carouselOuter.addEventListener('mouseleave', () => {
  popupAnimal.style.opacity = '0';
  popupAnimal.style.transform = 'translateY(20px)';
});
</script>
