<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Rhodes Stadium Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />
  <style>
    #map { height: 500px; width: 100%; }
  </style>
</head>
<body>

<h2>Rhodes Stadium — Katy, TX</h2>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  const stadiumLat = 29.7964;
  const stadiumLng = -95.8047;

  const map = L.map('map').setView([stadiumLat, stadiumLng], 15);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  L.marker([stadiumLat, stadiumLng])
    .addTo(map)
    .bindPopup('<b>Rhodes Stadium</b><br>1733 Katyland Dr, Katy, TX')
    .openPopup();
</script>

</body>
</html>
