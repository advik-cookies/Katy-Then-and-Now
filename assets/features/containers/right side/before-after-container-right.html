<!-- Before-After Image Container -->
<div class="slider-wrapper">

  <!-- Before-After Container -->
  <div class="before-after-container">
    <!-- After Image -->
    <img src="AFTER_IMAGE_URL" class="after-img" alt="After">

    <!-- Before Image -->
    <div class="before-image">
      <img src="BEFORE_IMAGE_URL" class="before-img" alt="Before">
    </div>

    <!-- Slider Handle -->
    <div class="slider-handle">
      <span class="arrow left">◀</span>
      <span class="arrow right">▶</span>
    </div>
  </div>

  <!-- Popup Animal -->
  <img class="popup-animal" src="https://i.imgur.com/8bud9ho.png" alt="Cute Animal">
</div>

<style>
/* Slider Wrapper */
.slider-wrapper {
  position: relative;
  width: 100%;
  max-width: 1200px;
  margin-top: 20px;
  overflow: visible;
}

/* Before-After Container */
.before-after-container {
  position: relative;
  width: 100%;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 8px 15px rgba(0,0,0,0.2);
  background: #000;
}

/* Base Image (After) */
.after-img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
}

/* Before Overlay */
.before-image {
  position: absolute;
  top: 0;
  left: 0;
  width: 50%;
  height: 100%;
  overflow: hidden;
  pointer-events: none;
}

/* Before Image */
.before-img {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  width: auto;
  object-fit: cover;
}

/* After Image Formatting */
.before-after-container img.after-img {
  position: relative;
}

/* Slider Handle */
.slider-handle {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 10px;
  height: 100%;
  background: linear-gradient(to bottom, #DAA520, #FFD700);
  cursor: ew-resize;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 5px;
}

.slider-handle .arrow {
  position: absolute;
  font-size: 14px;
  color: white;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.slider-handle .arrow.left { left: -20px; }
.slider-handle .arrow.right { right: -20px; }
.slider-handle:hover .arrow { opacity: 1; }

/* Popup Animal */
.popup-animal {
  position: absolute;
  bottom: -20px;
  left: 0;
  width: 100px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.35s ease, transform 0.35s ease;
  pointer-events: none;
  z-index: 9999;
}

.slider-wrapper:hover .popup-animal {
  opacity: 1;
  transform: translateY(0);
}

/* Responsive Adjustments */
@media (max-width: 768px) {
  .popup-animal {
    width: 100px;
  }
}

@media (max-width: 480px) {
  .popup-animal {
    width: 80px;
  }
}
</style>

<script>
const wrapper = document.querySelector('.slider-wrapper');
const container = wrapper.querySelector('.before-after-container');
const beforeImage = container.querySelector('.before-image');
const handle = container.querySelector('.slider-handle');
const popupAnimal = wrapper.querySelector('.popup-animal');

let isDragging = false;
let popupTimeout = null;

const afterImg = container.querySelector('.after-img');
afterImg.addEventListener('load', () => {
  const rect = container.getBoundingClientRect();
  beforeImage.style.height = rect.height + 'px';
});

/* Mouse events */
handle.addEventListener('mousedown', () => isDragging = true);
window.addEventListener('mouseup', () => isDragging = false);

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const rect = container.getBoundingClientRect();
  let offsetX = e.clientX - rect.left;
  offsetX = Math.max(0, Math.min(offsetX, rect.width));
  beforeImage.style.width = offsetX + 'px';
  handle.style.left = offsetX + 'px';
});

/* Touch events */
handle.addEventListener('touchstart', () => isDragging = true);
window.addEventListener('touchend', () => isDragging = false);

window.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  const touch = e.touches[0];
  const rect = container.getBoundingClientRect();
  let offsetX = touch.clientX - rect.left;
  offsetX = Math.max(0, Math.min(offsetX, rect.width));
  beforeImage.style.width = offsetX + 'px';
  handle.style.left = offsetX + 'px';
});

/* Popup Animal Logic */
container.addEventListener('mouseenter', () => {
  popupAnimal.style.opacity = '1';
  popupAnimal.style.transform = 'translateY(0)';
  if (popupTimeout) clearTimeout(popupTimeout);
  popupTimeout = setTimeout(() => {
    popupAnimal.style.opacity = '0';
    popupAnimal.style.transform = 'translateY(20px)';
  }, 10000);
});

container.addEventListener('mouseleave', () => {
  popupAnimal.style.opacity = '0';
  popupAnimal.style.transform = 'translateY(20px)';
});
</script>
