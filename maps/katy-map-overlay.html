<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Katy Map Overlay</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
        <style>
            #map {height: 100vh; }
            #opacityControl {
                position: absolute;
                top: 18.5px;
                left: 60px;
                background: white;
                padding: 8px;
                border-radius: 4px;
                z-index: 1000;
            }
        </style>
    </head>
    <body>
        <div id="opacityControl">
            Opacity:
            <input id="opacity" type="range" min="0" max="1" step="0.01" value="0.6">
        </div>

        <div id="map"></div>

        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
        <script>
            const map = L.map('map').setView([29.84, -95.765], 9.5);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);

            const historic = L.tileLayer('https://mapwarper.net/maps/tile/100356/{z}/{x}/{y}.png', {
                opacity: 0.6,
                maxZoom: 19
            }).addTo(map);

            document.getElementById('opacity').addEventListener('input', e => {
                historic.setOpacity(e.target.value);
            });
        </script>
    </body>
</html>
